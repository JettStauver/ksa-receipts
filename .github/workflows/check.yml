name: check
on: [push, pull_request]
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl reportlab pypdf
      - name: Self-test
        run: python3 -I plugins/ksa-receipts/tests/selftest.py
      - name: Versions match
        run: |
          python3 - <<'PY'
          import json, sys
          m = json.load(open(".claude-plugin/marketplace.json"))
          for p in m["plugins"]:
              v = json.load(open(p["source"] + "/.claude-plugin/plugin.json"))["version"]
              if v != p["version"]:
                  sys.exit(f"{p['name']}: marketplace says {p['version']}, plugin.json says {v}")
          print("versions ok")
          PY
      - name: No personal data
        run: |
          ! grep -rInE '[0-9]{4}[ -]?[0-9]{4}[ -]?[0-9]{4}[ -]?[0-9]{4}' plugins/ || (echo "possible card number"; exit 1)
